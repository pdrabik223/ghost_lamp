<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8">
    <title>Ghost Lamp Control</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">


    <style>
        :root {
            --ink: #e9f5f0;
            --muted: #8ca8a2;
            --panel: rgba(13, 28, 29, 0.84);
            --line: rgba(154, 223, 199, 0.22);
            --accent: #a8f0d0;
            --accent-strong: #69d6ab;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--ink);
            background:
                radial-gradient(circle at 78% 18%, rgba(113, 198, 166, 0.13), transparent 23rem),
                radial-gradient(circle at 18% 90%, rgba(81, 128, 142, 0.14), transparent 25rem),
                #071113;
            font-family: Georgia, 'Times New Roman', serif;
        }

        main {
            width: min(1040px, calc(100% - 2rem));
            margin: 0 auto;
            padding: 4rem 0 3rem;
        }

        .masthead {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 2rem;
            margin-bottom: 2.5rem;
        }

        .eyebrow {
            margin: 0 0 0.6rem;
            color: var(--accent);
            font: 0.72rem/1.2 monospace;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(3.5rem, 11vw, 7.5rem);
            font-weight: 400;
            letter-spacing: 0.04em;
            line-height: 0.8;
            text-shadow: 0 0 24px rgba(168, 240, 208, 0.25);
        }

        .signal {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            margin: 0 0 0.45rem;
            color: var(--muted);
            font: 0.72rem monospace;
            text-transform: uppercase;
        }

        .signal::before {
            width: 0.55rem;
            height: 0.55rem;
            border-radius: 50%;
            background: var(--accent-strong);
            box-shadow: 0 0 12px var(--accent-strong);
            content: '';
        }

        .console {
            overflow: hidden;
            border: 1px solid var(--line);
            background: var(--panel);
            box-shadow: 0 2rem 5rem rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(12px);
        }

        .top-panels {
            display: grid;
            grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr);
        }

        .panel,
        .settings-panel {
            padding: clamp(1.5rem, 4vw, 3rem);
        }

        .mode-panel {
            border-right: 1px solid var(--line);
        }

        .settings-panel {
            border-top: 1px solid var(--line);
        }

        h2 {
            margin: 0 0 0.4rem;
            font-size: 1.8rem;
            font-weight: 400;
        }

        .intro {
            margin: 0 0 2rem;
            color: var(--muted);
        }

        label {
            color: var(--ink);
        }

        input[type='url'],
        input[type='range'] {
            accent-color: var(--accent-strong);
        }

        input[type='color'] {
            width: 100%;
            height: 3.2rem;
            padding: 0.35rem;
            cursor: pointer;
        }

        .range-row {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .range-row input {
            flex: 1;
        }

        output {
            min-width: 3.5rem;
            color: var(--accent);
            font: 0.95rem monospace;
            text-align: right;
        }

        button {
            width: 100%;
            border-color: var(--accent-strong);
            background: var(--accent-strong);
            color: #061311;
            font-weight: 700;
        }

        @media (max-width: 720px) {
            main {
                padding-top: 2.5rem;
            }

            .masthead {
                display: block;
            }

            .signal {
                margin-top: 1.5rem;
            }

            .top-panels {
                grid-template-columns: 1fr;
            }

            .mode-panel {
                border-right: 0;
                border-bottom: 1px solid var(--line);
            }

        }
    </style>


</head>

<body>
    <main>
        <header class="masthead">
            <div>

                <h1>Ghostly lamp</h1>
            </div>

        </header>

        <section class="console" aria-label="Ghost lamp settings">
            <div class="top-panels">
                <section class="panel mode-panel">
                    <h2>Mode</h2>
                    <p class="intro">Choose how the lamp moves through the dark.</p>

                    <label for="modeSelector">Light behavior</label>
                    <select id="modeSelector" name="modeSelector" onchange="selectAnimation()">
                        <option value="single_color">Single Color</option>
                        <option value="spiral" selected>Spiral</option>
                        <option value="day_cycle_animation">Day animation</option>
                        <option value="off">Off</option>
                    </select>
                </section>
                <script>
                    window.onload = function () {
                        selectAnimation();
                    };
                    function selectAnimation() {
                        var animations = ["single_color", "spiral", "day_cycle_animation", "off"]

                        for (var i = 0; i < animations.length; i++) {
                            document.getElementById(animations[i]).style.display = "none";
                        }

                        var select = document.getElementById("modeSelector").value
                        document.getElementById(select).style.display = "block";
                    }

                </script>
                <section class="panel color-panel">
                    <div>
                        <div id="single_color">
                            <h2>Color</h2>
                            <p>Single color</p>
                            <input id="single_color_value" type="color" value="{{single_color_value}}">
                        </div>


                        <div id="spiral">
                            <h2>Spiral</h2>
                            <p>Spiral animation cycling colors</p>

                            <!-- <label for="colorPicker">Spiral speed</label> -->
                            <!-- <input id="spiral_speed" type="range" min="1" max="100" value="{{spiral_speed}}">
                        <output id="spiral_speed_value" for="spiral_speed">{{spiral_speed}}</output> -->
                        </div>

                        <div id="day_cycle_animation">
                            <h2>Day animation</h2>
                            <label for="colorPicker">Animation following day sun cycle</label>
                        </div>

                        <div id="off">
                            <h2>The lamp is turned off</h2>
                        </div>
                    </div>
                </section>


            </div>


            <section class="settings-panel">
                <h2>General settings</h2>
                <label for="brightnessSlider">Brightness</label>
                <div class="range-row">
                    <input id="brightnessSlider" type="range" min="1" max="100" value="{{brightness}}">
                    <output id="brightnessValue" for="brightnessSlider">{{brightness}}%</output>
                </div>

                <label for="centralUrl">IOT Central URL</label>
                <input id="centralUrl" type="url" value="{{iot_central_url}}">

                <button id="saveButton" type="button" onclick="set_general_settings()">Save</button>
            </section>
        </section>
    </main>

    <script>
        function set_general_settings() {
            var brightness = document.getElementById("brightnessSlider").value
            var iot_central_url = document.getElementById("centralUrl").value
            var selected_animation = document.getElementById("modeSelector").value

            var query = `/v1/save_settings?brightness=${brightness}&iot_central_url=${iot_central_url}&selected_animation=${selected_animation}`

            query = query + '&' + animation_params();

            console.log(query)
            fetch(query, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                },

            }).then(data => {
                alert('✅ Settings saved successfully!');
            }).catch(error => {
                alert('❌ Error saving settings: ' + error + "\nquery: " + query);
            });

        }

        function animation_params() {
            // var animations = ["single_color", "spiral", "day_cycle_animation"]
            var animation_params = ""
            if (document.getElementById("modeSelector").value == "single_color")
                animation_params += `param1=${document.getElementById("single_color_value").value}`.replace("#", "")

            return animation_params
        }


    </script>

</body>

</html>
