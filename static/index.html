<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8">
    <title>Ghost Lamp Control</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <script src="script.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@6.0.1/dist/index.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css">

    <style>
        :root {
            --ink: #e9f5f0;
            --muted: #8ca8a2;
            --panel: rgba(13, 28, 29, 0.84);
            --line: rgba(154, 223, 199, 0.22);
            --accent: #a8f0d0;
            --accent-strong: #69d6ab;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--ink);
            background:
                radial-gradient(circle at 78% 18%, rgba(113, 198, 166, 0.13), transparent 23rem),
                radial-gradient(circle at 18% 90%, rgba(81, 128, 142, 0.14), transparent 25rem),
                #071113;
            font-family: Georgia, 'Times New Roman', serif;
        }

        main {
            width: min(1040px, calc(100% - 2rem));
            margin: 0 auto;
            padding: 4rem 0 3rem;
        }

        .masthead {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 2rem;
            margin-bottom: 2.5rem;
        }

        .eyebrow {
            margin: 0 0 0.6rem;
            color: var(--accent);
            font: 0.72rem/1.2 monospace;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(3.5rem, 11vw, 7.5rem);
            font-weight: 400;
            letter-spacing: 0.04em;
            line-height: 0.8;
            text-shadow: 0 0 24px rgba(168, 240, 208, 0.25);
        }

        .signal {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            margin: 0 0 0.45rem;
            color: var(--muted);
            font: 0.72rem monospace;
            text-transform: uppercase;
        }

        .signal::before {
            width: 0.55rem;
            height: 0.55rem;
            border-radius: 50%;
            background: var(--accent-strong);
            box-shadow: 0 0 12px var(--accent-strong);
            content: '';
        }

        .console {
            overflow: hidden;
            border: 1px solid var(--line);
            background: var(--panel);
            box-shadow: 0 2rem 5rem rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(12px);
        }

        .top-panels {
            display: grid;
            grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr);
        }

        .panel,
        .settings-panel {
            padding: clamp(1.5rem, 4vw, 3rem);
        }

        .mode-panel {
            border-right: 1px solid var(--line);
        }

        .settings-panel {
            border-top: 1px solid var(--line);
        }

        h2 {
            margin: 0 0 0.4rem;
            font-size: 1.8rem;
            font-weight: 400;
        }

        .intro {
            margin: 0 0 2rem;
            color: var(--muted);
        }

        label {
            color: var(--ink);
        }

        input[type='url'],
        input[type='range'] {
            accent-color: var(--accent-strong);
        }

        input[type='color'] {
            width: 100%;
            height: 3.2rem;
            padding: 0.35rem;
            cursor: pointer;
        }

        .range-row {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .range-row input {
            flex: 1;
        }

        output {
            min-width: 3.5rem;
            color: var(--accent);
            font: 0.95rem monospace;
            text-align: right;
        }

        button {
            width: 100%;
            border-color: var(--accent-strong);
            background: var(--accent-strong);
            color: #061311;
            font-weight: 700;
        }

        @media (max-width: 720px) {
            main {
                padding-top: 2.5rem;
            }

            .masthead {
                display: block;
            }

            .signal {
                margin-top: 1.5rem;
            }

            .top-panels {
                grid-template-columns: 1fr;
            }

            .mode-panel {
                border-right: 0;
                border-bottom: 1px solid var(--line);
            }

        }
    </style>


</head>

<body>
    <main>
        <header class="masthead">
            <div>

                <h1>Ghostly lamp</h1>
            </div>

        </header>

        <section class="console" aria-label="Ghost lamp settings">
            <div class="top-panels">
                <section class="panel mode-panel">
                    <h2>Mode</h2>
                    <p class="intro">Choose animations.</p>

                    <select name="animation" id="animation-select">
                        <option value="single">Single color</option>
                        <option value="soft_spiral">Soft Spiral</option>
                    </select>
                    <button id="addAnimation" type="button">Add</button>
                </section>

                <section class="panel color-panel">
                    <input type="text"></input>
                    <div id="editor" style="height: 400px;"></div>
                    <button id="saveAnimations" type="button">Save</button>
                </section>

            </div>

            <section class="settings-panel">
                <h2>Ghostly lamp</h2>
                <label for="brightnessSlider">Brightness</label>
                <div class="range-row">
                    <input id="brightnessSlider" type="range" min="1" max="100" value="{{brightness}}">
                    <output id="brightnessValue" for="brightnessSlider">{{brightness}}%</output>
                </div>

                <label for="centralUrl">IOT Central URL</label>
                <input id="centralUrl" type="url" value="{{iot_central_url}}">

                <button id="saveButton" type="button">Save</button>
            </section>
        </section>


        <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>

        <script>
            window.addEventListener('keydown', function (e) {
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                    e.preventDefault();
                    console.log("saving ")
                    //TODO save to rpi pi pico 
                }
            });

            require.config({
                paths: {
                    vs: "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs"
                }
            });

            require(["vs/editor/editor.main"], function () {

                const editor = monaco.editor.create(
                    document.getElementById("editor"),
                    {
                        value: `def main(name):
    message = f"Hello, {name}!"
    print(message)

hello("World")`,

                        language: "python",

                        theme: "vs-dark",

                        automaticLayout: true,

                        fontSize: 15,

                        minimap: {
                            enabled: false
                        }
                    }
                );

            });
        </script>

    </main>

</body>

</html>
